trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self

  - task: NodeTool@0
    displayName: 'Node.js 18'
    inputs:
      versionSpec: '18.x'

  - script: |
      npm install
      npm run build
    displayName: 'Build React'

  - task: FtpUpload@2
    displayName: 'Deploy forbidden'
    inputs:
      credentialsOption: 'inputs'
      serverUrl: 'ftp://$(ftpServer)'
      username: '$(ftpUser)'
      password: '$(ftpPassword)'
      rootDirectory: 'build'
      filePatterns: '**'
      remoteDirectory: '/public_html/forbidden/'
      clean: true
