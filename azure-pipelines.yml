trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self

  - task: NodeTool@0
    displayName: 'Node.js 18'
    inputs:
      versionSpec: '18.x'

  - script: |
      npm install
      npm run build
    displayName: 'Build React'
    env:
      # CRA/react-scripts trata warnings de ESLint como erro quando detecta
      # ambiente de CI (TF_BUILD). O projeto ainda tem warnings legados de
      # lint, entao mantemos o build de producao tolerante a warnings.
      CI: 'false'

  - task: FtpUpload@2
    displayName: 'Deploy forbidden'
    inputs:
      credentialsOption: 'inputs'
      serverUrl: 'ftp://$(ftpServer)'
      username: '$(ftpUser)'
      password: '$(ftpPassword)'
      rootDirectory: 'build'
      filePatterns: '**'
      remoteDirectory: '/public_html/forbidden/'
      clean: true
